[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alwayson"
version = "0.1.0"
description = "AlwaysOn: autonomous infrastructure recovery and failover platform."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
alwayson = "alwayson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
